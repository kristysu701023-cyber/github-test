<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub 連接測試</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
    }
    .card {
      background: white;
      padding: 48px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 500px;
    }
    h1 { color: #10b981; margin-bottom: 16px; font-size: 2rem; }
    p { color: #4b5563; font-size: 1.15rem; line-height: 1.6; }
    .badge {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 14px;
      background: #ecfdf5;
      color: #059669;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 Hello！GitHub 連接成功！</h1>
    <p>這是 Kristy 的 AI Agent 第一次成功推送與部署的 GitHub Pages 測試頁面。</p>
    <div class="badge">狀態：連線與部署皆正常</div>
  </div>
</body>
</html>
